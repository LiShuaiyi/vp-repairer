stages:
- test

image: continuumio/anaconda3

before_script:
  # install ssh-agent
  - 'which ssh-agent || ( apt-get update -y && apt-get install openssh-client -y )'
    # run ssh-agent
  - eval $(ssh-agent -s)
    # add ssh key stored in SSH_PRIVATE_KEY variable to the agent store
  - ssh-add <(echo "$SSH_PRIVATE_KEY")
    # disable host key checking (NOTE: makes you susceptible to man-in-the-middle attacks)
    # WARNING: use only in docker container, if you use it with shell you will overwrite your user's ssh config
  - mkdir -p ~/.ssh
  - echo -e "Host *\n\tStrictHostKeyChecking no\n\n" > ~/.ssh/config
  - apt update -qq -y && apt install ffmpeg -y

.python-prepare: &python-prepare
  - git config --global url."https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.lrz.de".insteadOf "ssh://git@gitlab.lrz.de"
  - pip install -r ./requirements.txt
  - pip install tox coverage

.install-drivability-checker: &install-drivability-checker
  - cd ./src/commonroad-drivability-checker
  - bash build.sh -e $CONDA_PREFIX -v 3.7 -i -j 2
  - cd ../..

build_and_test_python_3_7:
  stage: test
  rules:
    - if: '$CI_COMMIT_BRANCH == "development" || $CI_PIPELINE_SOURCE == "merge_request_event"'
  before_script:
    - source activate cr37
    - *python-prepare
    - *install-drivability-checker
  script:
    - python setup.py install
    - coverage run -m pytest tests
    - coverage report -m || true
